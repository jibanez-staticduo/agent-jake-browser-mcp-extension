name: CI

# DGX-309 B1: CI en GitHub sobre los PRs (auto-update de los forks).
# El job `deltas` es el guardagias de los deltas del fork: revertir cualquiera
# de las aserciones de scripts/check-deltas.sh es un FALLO, no un exito.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A merge to main must never cancel a running `publicar`; only superseded PR runs are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    runs-on: arc-k8s
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # El job no ejecuta el e2e de Playwright (solo tsc + vitest, criterio 1
      # de DGX-309); saltar la descarga de navegadores del postinstall de
      # playwright abarata el job en el runner ARC.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # El runner arc-k8s no trae Node (imagen pelada de actions-runner, ver
      # skill ci-runners-arc); se baja uno verificado por sha256 a RUNNER_TEMP,
      # patron de pocharlies-org/k8s-gitops-pocharlies reusable-ci.yml.
      - name: Install verified Node.js 22.23.2
        run: |
          set -euo pipefail
          version=v22.23.2
          case "$(uname -m)" in
            x86_64|amd64) arch=x64; expected=b294a556e639d64338823920e5866c21c02741742d2e1529ee1a225c1ec9252a ;;
            *) echo "Unsupported Node runner architecture: $(uname -m)"; exit 1 ;;
          esac
          archive="$RUNNER_TEMP/node-${version}-${arch}.tar.gz"
          curl --retry 3 --retry-all-errors -fsSL \
            "https://nodejs.org/dist/${version}/node-${version}-linux-${arch}.tar.gz" \
            -o "$archive"
          echo "${expected}  ${archive}" | sha256sum --check --strict
          tar xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/node-${version}-linux-${arch}/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      # En este repo `npm test` es el e2e de Playwright; el vitest unitario
      # vive en test:unit (excluido el e2e por vitest.config.ts).
      - name: Unit tests (vitest)
        run: npm run test:unit

      # Cada PR prueba build neutra + firma + verificacion con una clave efimera (no sube nada).
      - name: Publicar en seco (build neutra + firma)
        run: bash scripts/publicar.sh --dry-run

  deltas:
    runs-on: arc-k8s
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Aserciones de deltas del fork (subset 2, 2b, 3-9)
        run: bash scripts/check-deltas.sh

  # Tras cada merge a main se publica la build neutra y firmada en el pod; cada extensión
  # instalada en <Descargas>/agent-jake-browser se reescribe sola desde ella (self-update.ts).
  publicar:
    name: Publicar la build firmada y desplegarla en x86 y Mac
    needs: [build-test, deltas]
    # Solo push a main. NUNCA pull_request: el secreto de firma y el runner del host no se exponen a PRs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Runner del x86 solo porque tiene kubectl hacia el pod de agentjake-browser.
    runs-on: [self-hosted, x86, agent-browser]
    # Publicar (~1 min de build neutra) + dos syncs, cada uno con su build y su recarga del
    # navegador, que espera hasta 90 s al service worker (INFRA-858).
    timeout-minutes: 30
    concurrency: { group: publicar-extension, cancel-in-progress: false }
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false, fetch-depth: 0 }

      # Mismo Node verificado que build-test, sin depender del node del host.
      - name: Install verified Node.js 22.23.2
        run: |
          set -euo pipefail
          version=v22.23.2
          case "$(uname -m)" in
            x86_64|amd64) arch=x64; expected=b294a556e639d64338823920e5866c21c02741742d2e1529ee1a225c1ec9252a ;;
            *) echo "Unsupported Node runner architecture: $(uname -m)"; exit 1 ;;
          esac
          archive="$RUNNER_TEMP/node-${version}-${arch}.tar.gz"
          curl --retry 3 --retry-all-errors -fsSL \
            "https://nodejs.org/dist/${version}/node-${version}-linux-${arch}.tar.gz" \
            -o "$archive"
          echo "${expected}  ${archive}" | sha256sum --check --strict
          tar xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/node-${version}-linux-${arch}/bin" >> "$GITHUB_PATH"

      - name: npm ci
        run: npm ci
        env: { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1' }
      - name: Publicar
        run: bash scripts/publicar.sh
        env: { AJB_UPDATE_SIGNING_KEY: '${{ secrets.AJB_UPDATE_SIGNING_KEY }}' }
      - name: Desplegar en x86 y Mac
        # El zip publicado solo AVISA a quien abre el navegador; los dos navegadores del Dani
        # (x86 y Mac, instalación descomprimida fuera de Downloads) no se auto-reescriben: los
        # pone al día agent-browser-sync.sh, que hasta aquí nadie ejecutaba al fusionar. Sin este
        # paso, un Chrome abierto durante días se queda con la versión vieja aunque el pod ya
        # anuncie la nueva (INFRA-858). El vigilante (agent-browser-sync-watch.service) sigue
        # cubriendo el navegador cerrado o dormido: se sincroniza al reconectarse.
        # Se llama a x86 y Mac sueltos, nunca `all`: `all` volvería a construir y subir el zip que
        # el paso anterior acaba de publicar.
        run: |
          set -euo pipefail
          sync="$HOME/.local/libexec/x86-host-runtime/agent-browser-sync.sh"
          [[ -x "$sync" ]] || { echo "falta $sync: el runtime del x86 no está instalado" >&2; exit 1; }
          bash "$sync" --force x86
          bash "$sync" --force mac
